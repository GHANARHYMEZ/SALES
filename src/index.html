<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="copyright" content="© 2026 J. O. ACQUAAH. All Rights Reserved.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ee;--panel:#fff;--ink:#14251c;--mut:#5d6e64;--line:#d6ddd7;--brand:#0f5c3a;--onbrand:#fff;--gold:#f2b705;--red:#b3261e;--soft:#e3ece5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--panel:#16211b;--ink:#e8f0ea;--mut:#9bb0a3;--line:#27382e;--brand:#3fbf82;--onbrand:#06140d;--gold:#f2c230;--red:#ff8a80;--soft:#1e2e25}}
:root[data-theme="dark"]{--bg:#0e1612;--panel:#16211b;--ink:#e8f0ea;--mut:#9bb0a3;--line:#27382e;--brand:#3fbf82;--onbrand:#06140d;--gold:#f2c230;--red:#ff8a80;--soft:#1e2e25}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{background:var(--brand);color:var(--onbrand);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav .logo{font:800 20px 'Bricolage Grotesque';padding:0 10px 14px}
nav .logo small{display:block;font:400 12px Figtree;opacity:.8}
nav button{all:unset;cursor:pointer;padding:10px;border-radius:8px;font-weight:500}
nav button.on{background:var(--gold);color:#14251c;font-weight:700}
nav button:focus-visible,.b:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
nav .sp{flex:1}
main{padding:22px;max-width:1100px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.top h2{font-size:26px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font:800 24px 'Bricolage Grotesque'}.stat span,.mut{color:var(--mut);font-size:13px}
.red{color:var(--red)}
.b{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:500;text-align:center}
.b.p{background:var(--brand);color:var(--onbrand);border-color:var(--brand);font-weight:700}
.b.sm{padding:4px 10px;font-size:13px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
label{display:block;margin:0 0 10px;font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:500;font-size:13px}td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.pos{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.plist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:10px}
.prod{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:block}
.prod:hover{border-color:var(--brand)}.prod:focus-visible{outline:3px solid var(--gold)}
.prod b{display:block}.prod .pr{font:700 16px 'Bricolage Grotesque';color:var(--brand);margin-top:4px}
.ticket{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--gold);border-radius:4px 4px 10px 10px;padding:14px;position:sticky;top:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 4px;font-weight:500;font-size:14px}
.seg button.on{background:var(--brand);color:var(--onbrand);font-weight:700}
.line{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.q{display:flex;align-items:center;gap:6px}.q button{all:unset;cursor:pointer;width:24px;height:24px;border-radius:6px;background:var(--soft);text-align:center;font-weight:700}
.tot{display:flex;justify-content:space-between;font:800 22px 'Bricolage Grotesque';margin:12px 0}
.bar{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.bar div{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bar i{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font:11px Figtree;color:var(--mut)}
.rank{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.rank span{height:8px;background:var(--gold);border-radius:4px;display:block}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#m[hidden]{display:none}
.box{background:var(--panel);border-radius:12px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
.box h3{margin-bottom:12px}.row{display:flex;gap:8px;justify-content:flex-end}.row .b{flex:1}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;z-index:30;font-size:14px}
#t[hidden]{display:none}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:13px}.rc div{display:flex;justify-content:space-between}
.rcp{border:2px double var(--ink);padding:14px;font-size:13px}.rcp table{width:100%;border-collapse:collapse}.rcp td,.rcp th{padding:3px 0;border:0;font-size:inherit}.rcp small{color:var(--mut)}
.rh{text-align:center;margin-bottom:8px}.rh h4{margin:0 0 2px;font:800 20px 'Bricolage Grotesque',Figtree,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.rt{text-align:center;font-weight:700;letter-spacing:.2em;text-transform:uppercase;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:4px 0;margin:6px 0 8px}
.rm td:first-child{color:var(--mut)}.ri{margin:10px 0}.ri th{border-bottom:1px solid var(--ink);color:var(--ink);font-weight:700;font-size:12px;padding:4px 0}.ri td{border-bottom:1px dotted var(--line)}
.rtot{border-top:1px solid var(--ink);padding-top:4px}.rtot .gt td{font:800 16px 'Bricolage Grotesque',Figtree,sans-serif;color:var(--ink);padding:6px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}.rtot .bal td{font-weight:700}
.rs{display:flex;justify-content:space-between;gap:16px;margin-top:34px}.rs span{flex:1;border-top:1px solid var(--ink);text-align:center;font-size:11px;color:var(--mut);padding-top:3px}
.rf{text-align:center;margin:12px 0 0;font-size:12px;color:var(--mut)}
.cp{color:var(--mut);font-size:12px;text-align:center}
footer.cp{grid-column:2;padding:14px 12px 18px}
#sp{position:fixed;inset:0;z-index:50;background:var(--brand);color:var(--onbrand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:opacity .4s}
#sp h1{font-size:34px}#sp .cp{color:var(--onbrand);opacity:.85}#sp.out{opacity:0;pointer-events:none}
#pf,.pp{display:none}
@page{margin:6mm}
@media print{html,body{background:#fff!important}body *{visibility:hidden}#m,#m *{visibility:visible;color:#000!important}#m{position:absolute;inset:auto;left:0;top:0;width:100%;display:block;padding:0;background:#fff}.box{max-width:80mm;max-height:none;overflow:visible;margin:0 auto;padding:0;background:#fff;border-radius:0}.rc,.rcp{font-size:12px}.rcp{border-color:#000}.row,#t{display:none!important}}
@media(max-width:800px){
.app{display:block}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;gap:2px}
nav .logo,nav .sp,nav .set{display:none}
nav{overflow-x:auto}nav button{flex:0 0 auto;text-align:center;padding:9px 10px;font-size:12px;white-space:nowrap}
main{padding:14px 12px 10px}footer.cp{padding-bottom:84px}
.pos{grid-template-columns:1fr}.ticket{position:static}
:root{padding-bottom:0}
}
@media print{#sp{display:none!important}body.prr *{visibility:visible}body.prr nav,body.prr #m,body.prr .seg,body.prr .nobp,body.prr footer.cp{display:none!important}body.prr .app{display:block}body.prr main{padding:0;max-width:none}body.prr .pp{display:block;margin:0 0 10px}body.prr .card{break-inside:avoid}body.prr #pf{display:block;position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:#000;padding-top:4px;border-top:1px solid #000;background:#fff}}
</style>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main id="v"></main>
<footer class="cp">© 2026 J. O. ACQUAAH. All Rights Reserved.</footer>
</div>
<div id="pf">© 2026 J. O. ACQUAAH. All Rights Reserved.</div>
<div id="sp"><h1>ShopDesk Ghana</h1><div>Loading your shop</div><div class="cp">© 2026 J. O. ACQUAAH. All Rights Reserved.</div></div>
<div id="m" hidden></div><div id="t" hidden></div><datalist id="cats"><option>Rent<option>Salaries<option>Transport<option>Electricity<option>Water<option>Phone and data<option>MoMo charges<option>Repairs<option>Other</datalist>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>'GH₵ '+(+n).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});
const seed=()=>({shop:'My Shop',tax:0,n:20,
products:[],
customers:[],sales:[]});
try{if(!localStorage.getItem('shopdesk-gh-clean1')){localStorage.removeItem('shopdesk-gh');localStorage.setItem('shopdesk-gh-clean1','1')}}catch(e){}
let S,RAW=null,KEY=null,SALT=null,IT=310000,sq=Promise.resolve();
try{const j=JSON.parse(localStorage.getItem('shopdesk-gh')||'null');if(j&&j.ct)RAW=j;else if(j&&j.products)S=j}catch(e){}
function norm(){['suppliers','purchases','exp','pay','log'].forEach(k=>S[k]=S[k]||[]);S.vat=S.vat||{on:false,tin:'',addr:'',incl:true};
if(!S.staff||!S.staff.length)S.staff=[{id:1,name:'Owner',role:'owner',pin:'1234'}]}
let U=null;
console.info('%c'+'© 2026 J. O. ACQUAAH. All Rights Reserved.','font-weight:700');
function printReport(){document.body.classList.add('prr');printPage();if(window.shopdeskNative||NAT())document.addEventListener('pointerdown',()=>document.body.classList.remove('prr'),{once:true,capture:true})}
addEventListener('afterprint',()=>document.body.classList.remove('prr'));
setTimeout(()=>{const e=document.getElementById('sp');if(e){e.classList.add('out');setTimeout(()=>e.remove(),500)}},1400);

const PERM={manager:['dash','pos','stock','cust','sales','buy','sup','exp','rep'],cashier:['pos','cust','sales']};
const can=t=>U.role=='owner'||(PERM[U.role]||[]).includes(t);
const un=id=>(S.staff.find(x=>x.id==id)||{}).name||'-';
const log=a=>{S.log.unshift({t:Date.now(),u:U?U.name:'',a});S.log.length=Math.min(S.log.length,300)};
const since=r=>r=='all'?0:r==1?new Date().setHours(0,0,0,0):Date.now()-r*864e5;
const dt=t=>new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ENC=new TextEncoder(),DEC=new TextDecoder();
const b64=u=>{const a=new Uint8Array(u);let r='';for(let i=0;i<a.length;i+=8192)r+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(r)},unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,it){const m=await crypto.subtle.importKey('raw',ENC.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(str,key,salt,it){const iv=crypto.getRandomValues(new Uint8Array(12));return{enc:'AES-GCM-256',kdf:'PBKDF2-SHA256',it,salt:b64(salt),iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,ENC.encode(str)))}}
async function unseal(env,key){return DEC.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},key,unb64(env.ct)))}
const save=()=>{if(!KEY)return;const str=JSON.stringify(S);sq=sq.then(async()=>{try{localStorage.setItem('shopdesk-gh',JSON.stringify(await seal(str,KEY,SALT,IT)))}catch(e){}})};
const lockScreen=h=>{$('#m').innerHTML='<div class="box">'+h+'<p class="cp" style="margin:14px 0 0">© 2026 J. O. ACQUAAH. All Rights Reserved.</p></div>';$('#m').hidden=false};
const NAT=()=>{const C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform())};
async function printPage(){try{if(window.shopdeskNative)await window.shopdeskNative.print();else if(NAT())await Capacitor.Plugins.PrintPage.print({name:'ShopDesk Ghana'});else window.print()}catch(e){toast('Printing is not available here')}}
function printNow(){document.body.classList.remove('prr');printPage()}
async function saveFile(name,text){
if(NAT()){const P=Capacitor.Plugins;await P.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});const u=await P.Filesystem.getUri({path:name,directory:'CACHE'});await P.Share.share({title:name,url:u.uri,dialogTitle:'Save your backup'});return}
const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function setupM(){const old=!!S;
lockScreen(`<h3>Protect your shop data</h3><p class="mut">Choose a passphrase. Everything saved on this device, and every backup file, is encrypted with it. You will type it each time you open ShopDesk. ${old?'Your existing data will be encrypted now. ':''}<b>If you forget it, your data cannot be recovered</b>, so write it down and keep it safe.</p><label>Passphrase (8 or more characters)<input id="ps1" type="password" autocomplete="new-password"></label><label>Repeat passphrase<input id="ps2" type="password" autocomplete="new-password"></label><p class="red" id="pse"></p><button class="b p" style="width:100%" id="psb">Encrypt and continue</button>`);
$('#psb').onclick=async()=>{const a=$('#ps1').value,e=$('#pse');if(a.length<8){e.textContent='Use at least 8 characters.';return}if(a!==$('#ps2').value){e.textContent='The two passphrases do not match.';return}
$('#psb').disabled=true;e.textContent='Encrypting…';try{const sl=crypto.getRandomValues(new Uint8Array(16)),k=await deriveKey(a,sl,IT);SALT=sl;KEY=k;if(!S)S=seed();norm();save();await sq;closeM();render()}catch(x){e.textContent='Encryption failed on this browser.';$('#psb').disabled=false}}}
function unlockM(){
lockScreen(`<h3>Unlock ${'ShopDesk'}</h3><p class="mut">Enter your passphrase to open your shop data.</p><label>Passphrase<input id="ul" type="password" autocomplete="current-password"></label><p class="red" id="ule"></p><button class="b p" style="width:100%" id="ulb">Unlock</button>`);
const go=async()=>{const e=$('#ule');e.textContent='Unlocking…';try{const sl=unb64(RAW.salt),k=await deriveKey($('#ul').value,sl,RAW.it),o=JSON.parse(await unseal(RAW,k));S=o;SALT=sl;IT=RAW.it;KEY=k;RAW=null;norm();closeM();render()}catch(x){e.textContent='Wrong passphrase. Try again.'}};
$('#ulb').onclick=go;$('#ul').addEventListener('keydown',ev=>{if(ev.key=='Enter')go()});$('#ul').focus()}
function boot(){if(!(window.crypto&&crypto.subtle)){lockScreen('<h3>Cannot start</h3><p class="mut">This page needs encryption support, which your browser only allows on a secure page. Open the saved file directly, or use an https address.</p>');return}
if(RAW)unlockM();else setupM()}
let view='dash',cart=[],mode='R',pay='cash',cust='',paidNow=0,q='';
const P=id=>S.products.find(p=>p.id==id),C=id=>S.customers.find(c=>c.id==id);
const toast=m=>{const t=$('#t');t.textContent=m;t.hidden=false;clearTimeout(toast.x);toast.x=setTimeout(()=>t.hidden=true,2400)};
const closeM=()=>$('#m').hidden=true;
function form(title,fields,cb,btn='Save'){
$('#m').innerHTML=`<div class="box"><h3>${title}</h3>${fields.map(f=>`<label>${f[1]}<input id="f_${f[0]}" ${f[0]=='cat'?'list="cats"':''} type="${f[2]||'text'}" value="${esc(f[3]??'')}" ${f[2]=='number'?'step="any" min="0"':''}></label>`).join('')}<div class="row"><button class="b" onclick="closeM()">Cancel</button><button class="b p" id="ok">${btn}</button></div></div>`;
$('#m').hidden=false;
$('#ok').onclick=()=>{const v={};fields.forEach(f=>{const x=$('#f_'+f[0]).value;v[f[0]]=f[2]=='number'?(+x||0):x.trim()});if(cb(v)!==false){log(title);save();closeM();render()}};
}
const tabs=[['dash','Dashboard'],['pos','Sell'],['buy','Purchases'],['stock','Stock'],['sup','Suppliers'],['cust','Customers'],['exp','Expenses'],['sales','Sales'],['rep','Reports'],['staff','Staff']];
function render(){
if(!U)return login();if(!can(view))view='pos';$('#nav').innerHTML=`<div class="logo">${esc(S.shop)}<small>${esc(U.name)}, ${U.role}</small></div>`+tabs.filter(t=>can(t[0])).map(t=>`<button class="${view==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')+`<div class="sp"></div>${U.role=='owner'?'<button class="set" onclick="settings()">Settings</button><button onclick="backupM()">Backup</button>':''}<button class="so" onclick="logout()">Sign out</button>`;
({dash,pos,stock,cust:customers,sales,buy:purchases,sup:suppliers,exp:expenses,rep:reports,staff:staffV})[view]();
}
const go=v=>{view=v;render();scrollTo(0,0)};
const day=t=>new Date(t).toDateString();
function dash(){
const td=S.sales.filter(s=>day(s.t)==day(Date.now())),sum=a=>a.reduce((x,s)=>x+s.total,0);
const profit=td.reduce((a,s)=>a+s.items.reduce((x,l)=>x+(l.price-l.cost)*l.qty,0),0);
const ex=S.exp.filter(e=>day(e.t)==day(Date.now())).reduce((a,e)=>a+e.amt,0),owed=S.customers.reduce((a,c)=>a+c.bal,0),low=S.products.filter(p=>p.stock<=p.low);
const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return{l:d.toLocaleDateString('en-GB',{weekday:'short'}),v:sum(S.sales.filter(s=>day(s.t)==d.toDateString()))}});
const mx=Math.max(1,...days.map(d=>d.v));
const top={};S.sales.forEach(s=>s.items.forEach(l=>top[l.name]=(top[l.name]||0)+l.qty));
const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),tm=tp[0]?tp[0][1]:1;
$('#v').innerHTML=`<div class="top"><h2>Today</h2><button class="b p" onclick="go('pos')">New sale</button></div>
<div class="grid"><div class="card stat"><span>Sales today</span><b>${fm(sum(td))}</b></div><div class="card stat"><span>Net profit today (after expenses)</span><b>${fm(profit-ex)}</b></div><div class="card stat"><span>Customers owe you</span><b class="${owed?'red':''}">${fm(owed)}</b></div><div class="card stat"><span>You owe suppliers</span><b>${fm(S.suppliers.reduce((a,c)=>a+c.bal,0))}</b></div><div class="card stat"><span>Items running low</span><b class="${low.length?'red':''}">${low.length}</b></div></div>
<div class="grid" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
<div class="card"><h3>Last 7 days</h3><div class="bar" style="margin-bottom:24px">${days.map(d=>`<div style="height:${d.v/mx*100}%" title="${fm(d.v)}"><i>${d.l}</i></div>`).join('')}</div></div>
<div class="card"><h3>Best sellers</h3>${tp.length?tp.map(t=>`<div class="rank"><div style="flex:1">${esc(t[0])}</div><span style="width:${t[1]/tm*80}px"></span><b>${t[1]}</b></div>`).join(''):'<p class="mut">Sell something and your best sellers appear here.</p>'}</div>
<div class="card"><h3>Restock soon</h3>${low.length?low.map(p=>`<div class="line"><span>${esc(p.name)}</span><b class="red">${p.stock} ${p.unit}</b></div>`).join(''):'<p class="mut">All items are above their reorder level.</p>'}</div></div>`;
}
function pos(){
$('#v').innerHTML=`<div class="top"><h2>Sell</h2></div><div class="pos"><div><input id="q" placeholder="Search items" value="${esc(q)}" oninput="q=this.value;drawList()"><div class="plist" id="pl"></div></div><div class="ticket" id="tk"></div></div>`;
drawList();drawCart();
}
function drawList(){
const l=S.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));

function add(id,pk){const p=P(id),st=pk?p.pk:1,l=cart.find(x=>x.id==id&&!!x.pk==!!pk),u=cart.filter(x=>x.id==id).reduce((a,x)=>a+x.qty,0)+st;if(u>p.stock)return toast('Only '+p.stock+' '+p.unit+' in stock');l?l.qty+=st:cart.push({id,qty:st,pk:!!pk});drawCart()}
function qty(id,d,pk){const l=cart.find(x=>x.id==id&&!!x.pk==!!pk),p=P(id),st=pk?p.pk:1,o=cart.filter(x=>x!=l&&x.id==id).reduce((a,x)=>a+x.qty,0);l.qty+=d*st;if(l.qty+o>p.stock){l.qty=Math.max(0,Math.floor((p.stock-o)/st)*st);toast('Only '+p.stock+' in stock')}if(l.qty<=0)cart=cart.filter(x=>x!=l);drawCart()}
function calc(){const L=cart.map(l=>{const p=P(l.id);return{id:l.id,name:p.name+(l.pk?' (pack)':''),qty:l.qty,cost:p.cost,pk:l.pk,txb:S.vat.on&&!/^n/i.test(p.tx||''),price:l.pk?p.pp/p.pk:(mode=='W'?p.ws:p.rt)}});
let sub=0,vat=0,nh=0,gf=0;L.forEach(l=>{const g=l.price*l.qty;if(!l.txb){sub+=g;return}const b=S.vat.incl?g/1.2:g;sub+=b;vat+=b*.15;nh+=b*.025;gf+=b*.025});
const tax=vat+nh+gf;return{L,sub,vat,nh,gf,tax,tot:sub+tax}}

function charge(){
const c=calc();if(!c.L.length)return toast('Add at least one item');

const paid=pay=='credit'?Math.min(paidNow,c.tot):c.tot,id=S.n++;
c.L.forEach(l=>P(l.id).stock-=l.qty);
if(pay=='credit'&&cust)C(cust).bal+=c.tot-paid;
const s={id,t:Date.now(),items:c.L,sub:c.sub,tax:c.tax,vat:c.vat,nh:c.nh,gf:c.gf,total:c.tot,pay,cust:cust?+cust:0,paid,mode,u:U.id};
S.sales.unshift(s);log('Sale #'+id+' '+fm(c.tot));save();cart=[];paidNow=0;pay='cash';cust='';
receipt(s);render();
}

<div class="rh"><h4>${esc(S.shop)}</h4>${v.addr?`<div>${esc(v.addr)}</div>`:''}${v.tin?`<div>TIN: ${esc(v.tin)}</div>`:''}</div>
<div class="rt">${v.on?'Tax Invoice':'Sales Receipt'}</div>
<table class="rm"><tr><td>No.</td><td class="n"><b>${no}</b></td></tr><tr><td>Date</td><td class="n">${dd}</td></tr><tr><td>Time</td><td class="n">${tt}</td></tr><tr><td>Served by</td><td class="n">${esc(un(s.u))}</td></tr><tr><td>Customer</td><td class="n">${cu?esc(cu.name):'Walk-in customer'}</td></tr>${cu&&cu.tin?`<tr><td>Customer TIN</td><td class="n">${esc(cu.tin)}</td></tr>`:''}</table>
<table class="ri"><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr>${s.items.map(l=>`<tr><td>${esc(l.name)}${v.on&&!l.txb?' <small>(no VAT)</small>':''}</td><td class="n">${l.qty}</td><td class="n">${(+l.price).toFixed(2)}</td><td class="n">${(l.price*l.qty).toFixed(2)}</td></tr>`).join('')}</table>
<table class="rm rtot">${s.tax>0?tr('Value before tax',fm(s.sub))+tr('VAT 15%',fm(s.vat))+tr('NHIL 2.5%',fm(s.nh))+tr('GETFund 2.5%',fm(s.gf))+tr('Total tax',fm(s.tax)):''}<tr class="gt"><td>TOTAL</td><td class="n">${fm(s.total)}</td></tr>${tr('Payment method',pm)}${tr('Amount paid',fm(s.paid))}${s.total>s.paid?`<tr class="bal"><td>Balance owed</td><td class="n">${fm(s.total-s.paid)}</td></tr>`:''}</table>
<div class="rs"><span>Customer signature</span><span>Authorised signature</span></div>
<p class="rf">Thank you for your custom.${v.on?'<br>Internal record. Official GRA E-VAT invoices are issued through GRA’s E-VAT system.':''}</p>
</div><br><div class="row"><button class="b" onclick="printNow()">Print receipt</button><button class="b p" onclick="closeM()">Done</button></div></div>`;
$('#m').hidden=false;
}
addEventListener('offline',()=>toast('You are offline. Sales keep saving on this device.'));addEventListener('online',()=>toast('Back online'));
const LB='shopdesk-gh-lastbackup',PM='shopdesk-gh-premerge';
function backupM(){
let lb='',pre=false;try{lb=localStorage.getItem(LB);pre=!!localStorage.getItem(PM)}catch(e){}
$('#m').innerHTML=`<div class="box"><h3>Backup and merge</h3><p class="mut">Download an encrypted copy of all your shop data, or merge a backup file from another device into this one. Merging adds records that are missing here. It never deletes or overwrites what you already have.</p><p class="mut">${lb?'Last backup: '+dt(+lb):'No backup downloaded yet.'}</p><button class="b p" style="width:100%;margin-bottom:8px" onclick="doBackup()">Download backup</button><label class="b" style="display:block;margin-bottom:8px">Merge from backup file<input type="file" accept=".json,application/json" onchange="doMerge(this.files[0])" hidden></label>${pre?'<button class="b" style="width:100%;margin-bottom:8px" onclick="undoMerge()">Undo last merge</button>':''}<button class="b" style="width:100%;margin-bottom:8px" onclick="pwM()">Change passphrase</button><div id="bk"></div><div class="row"><button class="b" onclick="closeM()">Close</button></div></div>`;
$('#m').hidden=false}
async function doBackup(){
try{const env=await seal(JSON.stringify({app:'shopdesk-gh',t:Date.now(),data:S}),KEY,SALT,IT);
await saveFile('shopdesk-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'shopdesk-gh',v:2,...env}));
try{localStorage.setItem(LB,String(Date.now()))}catch(e){}
log('Backup downloaded');save();backupM();$('#bk').innerHTML='<p>Encrypted backup ready. You need your passphrase to open it. Keep the file somewhere safe, such as your email or a flash drive.</p>'}catch(e){toast('The backup was not saved')}}
function mergeData(o){
const ok=x=>x&&typeof x=='object',L=k=>(Array.isArray(o[k])?o[k]:[]).filter(ok),c={};
const byId=(k,nm)=>{const have=new Set((S[k]=S[k]||[]).map(x=>x.id));let n=0;L(k).forEach(x=>{if(x.id!=null&&!have.has(x.id)){S[k].push(x);have.add(x.id);n++}});c[nm]=n};
byId('products','items');byId('customers','customers');byId('suppliers','suppliers');byId('exp','expenses');byId('staff','staff');
const byIdT=(k,nm,fresh)=>{const sig=x=>x.t+'|'+x.total,have=new Set(S[k].map(sig)),used=new Set(S[k].map(x=>x.id));let n=0;L(k).forEach(x=>{if(have.has(sig(x)))return;if(used.has(x.id))x.id=fresh();used.add(x.id);have.add(sig(x));S[k].push(x);n++});S[k].sort((a,b)=>b.t-a.t);c[nm]=n};
byIdT('sales','sales',()=>S.n++);
byIdT('purchases','purchases',()=>Math.max(0,...S.purchases.map(x=>+x.id||0))+1);
S.n=Math.max(+S.n||0,...S.sales.map(x=>(+x.id||0)+1));
const byKey=(k,sig)=>{const have=new Set(S[k].map(sig));L(k).forEach(x=>{if(!have.has(sig(x))){S[k].push(x);have.add(sig(x))}})};
const n0=S.pay.length;byKey('pay',x=>x.t+'|'+x.k+'|'+x.who+'|'+x.amt);c.payments=S.pay.length-n0;S.pay.sort((a,b)=>a.t-b.t);
byKey('log',x=>x.t+'|'+x.a+'|'+x.u);S.log.sort((a,b)=>b.t-a.t);S.log.length=Math.min(S.log.length,300);
return c}
let pend=null;
function doMerge(f){
if(!f)return;const r=new FileReader();
r.onerror=()=>{$('#bk').innerHTML='<p class="red">Could not read that file.</p>'};
r.onload=async()=>{let j;try{j=JSON.parse(r.result);if(!j||typeof j!='object'||(j.app&&j.app!='shopdesk-gh'))throw 0}catch(e){$('#bk').innerHTML='<p class="red">That file is not a ShopDesk backup. Choose a .json file made with Download backup.</p>';return}
if(!j.ct){applyMerge(j);return}
if(j.salt===b64(SALT)){try{applyMerge(JSON.parse(await unseal(j,KEY)));return}catch(e){}}
pend=j;$('#bk').innerHTML='<label>Passphrase for that backup<input id="bp" type="password" autocomplete="off"></label><p class="red" id="bpe"></p><button class="b p" style="width:100%;margin-bottom:8px" onclick="mergeEnc()">Decrypt and merge</button>'};
r.readAsText(f)}
async function mergeEnc(){const e=$('#bpe');let o;try{o=JSON.parse(await unseal(pend,await deriveKey($('#bp').value,unb64(pend.salt),pend.it)))}catch(x){e.textContent='Wrong passphrase for that backup.';return}pend=null;applyMerge(o)}
async function applyMerge(j){
const o=j&&j.data?j.data:j;
if(!o||!Array.isArray(o.products)||!Array.isArray(o.sales)){$('#bk').innerHTML='<p class="red">That file is not a ShopDesk backup.</p>';return}
try{localStorage.setItem(PM,JSON.stringify(await seal(JSON.stringify(S),KEY,SALT,IT)))}catch(e){}
const c=mergeData(o),parts=Object.entries(c).filter(e=>e[1]>0).map(e=>e[1]+' '+e[0]);
log('Merged backup file');save();render();backupM();
$('#bk').innerHTML=parts.length?'<p><b>Merged:</b> '+parts.join(', ')+'.</p><p class="mut">Stock levels and customer balances you already had were kept as they are.</p>':'<p>Nothing new to add. This device already has everything in that file.</p>'}
async function undoMerge(){
try{const t=localStorage.getItem(PM);if(!t)return;S=JSON.parse(await unseal(JSON.parse(t),KEY));localStorage.removeItem(PM);U=S.staff.find(x=>x.id==U.id)||U;norm();save();render();backupM();$('#bk').innerHTML='<p>Last merge undone.</p>'}catch(e){toast('Could not undo the merge')}}
function pwM(){
lockScreen(`<h3>Change passphrase</h3><label>Current passphrase<input id="pw0" type="password" autocomplete="current-password"></label><label>New passphrase (8 or more characters)<input id="pw1" type="password" autocomplete="new-password"></label><label>Repeat new passphrase<input id="pw2" type="password" autocomplete="new-password"></label><p class="red" id="pwe"></p><div class="row"><button class="b" onclick="backupM()">Cancel</button><button class="b p" onclick="changePw()">Change</button></div>`)}
async function changePw(){const n=$('#pw1').value,e=$('#pwe');
if(n.length<8){e.textContent='Use at least 8 characters.';return}if(n!==$('#pw2').value){e.textContent='The new passphrases do not match.';return}
try{await sq;const env=JSON.parse(localStorage.getItem('shopdesk-gh'));await unseal(env,await deriveKey($('#pw0').value,unb64(env.salt),env.it))}catch(x){e.textContent='Current passphrase is wrong.';return}
try{const sl=crypto.getRandomValues(new Uint8Array(16)),k=await deriveKey(n,sl,IT);SALT=sl;KEY=k;try{localStorage.removeItem(PM)}catch(x){}log('Passphrase changed');save();await sq;backupM();$('#bk').innerHTML='<p>Passphrase changed. Backup files made earlier still need the old passphrase.</p>'}catch(x){e.textContent='Could not change the passphrase.'}}
function settings(){form('Settings',[['shop','Shop name','text',S.shop],['addr','Address and phone','text',S.vat.addr],['tin','Your TIN (GRA)','text',S.vat.tin],['on','VAT registered? (yes or no)','text',S.vat.on?'yes':'no'],['incl','Shelf prices already include VAT and levies? (yes or no)','text',S.vat.incl?'yes':'no']],v=>{S.shop=v.shop||S.shop;Object.assign(S.vat,{addr:v.addr,tin:v.tin,on:/^y/i.test(v.on),incl:!/^n/i.test(v.incl)})})}
function oldSettings(){form('Settings',[['shop','Shop name','text',S.shop],['tax','Tax added to each sale (%) — set 0 if prices already include tax','number',S.tax]],v=>{S.shop=v.shop||S.shop;S.tax=v.tax})}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!NAT())addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script>
